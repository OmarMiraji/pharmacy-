# Build the web app and publish it to Firebase Hosting (https://phyimacy-management-system.web.app)
# Runs on version tags like v1.0.32, or manually from the Actions tab.
name: Web hosting

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.6"
          cache: true

      - name: Get packages
        run: flutter pub get

      - name: Build web release
        run: flutter build web --release --base-href /app/

      # Landing page at /, the Flutter app at /app/ (web only; Windows and Android are unaffected).
      - name: Assemble site
        run: |
          rm -rf build/site
          mkdir -p build/site
          cp -r landing/. build/site/
          cp -r build/web build/site/app

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: phyimacy-management-system
          channelId: live
