# Build a Windows zip whenever you push a version tag like v1.0.1
name: Windows release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.6"
          architecture: x64
          cache: true

      - name: Get packages
        run: flutter pub get

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Build Windows release
        run: flutter build windows --release

      - name: Package Windows release (verify DLLs + setup folder)
        shell: pwsh
        run: |
          pwsh -NoProfile -File windows/installer/package_windows_release.ps1
          Copy-Item dist/pharmspecio-windows.zip phyimacy-windows.zip -Force
          Copy-Item dist/pharmspecio-windows.zip pharmspecio-windows.zip -Force

      - name: Install Inno Setup 6
        run: choco install innosetup --no-progress -y

      - name: Locate ISCC.exe
        id: iscc
        shell: pwsh
        run: |
          $candidates = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "${env:ProgramFiles}\Inno Setup 6\ISCC.exe"
          )
          foreach ($path in $candidates) {
            if (Test-Path $path) {
              Write-Host "Found ISCC at $path"
              "path=$path" >> $env:GITHUB_OUTPUT
              exit 0
            }
          }
          Get-ChildItem -Path "${env:ProgramFiles(x86)}" -Filter ISCC.exe -Recurse -Depth 3 -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "Candidate: $($_.FullName)" }
          throw "ISCC.exe not found after Inno Setup install"

      - name: Build PharmSpecio-Setup.exe (wizard installer)
        shell: pwsh
        run: |
          $version = (Select-String -Path pubspec.yaml -Pattern 'version:\s*([\d.]+)\+' | ForEach-Object { $_.Matches.Groups[1].Value })
          $iss = Join-Path $PWD "windows\installer\pharmspecio.iss"
          (Get-Content $iss -Raw) -replace '#define MyAppVersion "[^"]+"', "#define MyAppVersion `"$version`"" | Set-Content $iss -NoNewline
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $iscc = "${{ steps.iscc.outputs.path }}"
          & $iscc $iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compile failed with exit code $LASTEXITCODE" }
          $setup = Join-Path $PWD "dist\PharmSpecio-Setup-$version.exe"
          if (-not (Test-Path $setup)) { throw "Setup.exe was not created at $setup" }
          Write-Host "Created $setup ($((Get-Item $setup).Length) bytes)"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/PharmSpecio-Setup-*.exe
            phyimacy-windows.zip
            pharmspecio-windows.zip
            dist/PharmSpecio-Setup-Package-*.zip
          generate_release_notes: true
          make_latest: true

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.6"
          cache: true

      - name: Get packages
        run: flutter pub get

      - name: Build Android release
        run: flutter build apk --release

      - name: Name the phone package
        run: cp build/app/outputs/flutter-apk/app-release.apk pharmspecio.apk

      - name: Publish Android package
        uses: softprops/action-gh-release@v2
        with:
          files: pharmspecio.apk
          make_latest: true
